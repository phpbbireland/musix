[package]
name = "musix-desktop"
version = "0.1.3"
description = "Desktop wrapper for the Musix music library app"
authors = ["Mike"]
edition = "2021"
rust-version = "1.77"

# The binary Tauri runs. `main.rs` spawns the PHP server and opens the window.
[[bin]]
name = "musix-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Smaller, faster release builds for a desktop app.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
